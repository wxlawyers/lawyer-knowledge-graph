name: skill-check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  validate-frontmatter:
    name: Frontmatter validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Validate all skill frontmatter
        run: python scripts/validate_skills.py

  run-evals:
    name: Skill trigger evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Run trigger test cases
        run: python evals/run_evals.py
